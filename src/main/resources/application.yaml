spring:
  application:
    name: spring-Instagram
  config:
    import: ./config.yaml
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  datasource:
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    encoding:
      charset: utf-8
      force: true
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: smtp.gmail.com
    username: ${mail.username}
    password: ${mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    port: 587
    #메일보낼 때 처음부터 암호화 처리를 해서 보내는게 아니라 정말로 메일이 가고 있을 때 암호화 처리를 진행
mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

file:
  upload:
    path: ${db.upload.profile-path}
    board-path: ${db.upload.board-path}

jwt:
  secret: ${jwt.config.secret}
  access-expiry: 1800000
  refresh-expiry: 1209600000

kakao:
  client-id: 1020d64add49f43874eee8550e2b12fb
  redirect-uri: http://localhost:8080/api/kakao/callback
  client-secret: vxfi6xQbsnarK5Eu1RKHlMguc8yrYxjQ

logging:
  level:
    com.project.instagramclone: DEBUG # 내 프로젝트
    org.mybatis: DEBUG                # MyBatis
    # java.sql: DEBUG                   # SQL 작성문
    # java.sql.ResultSet: DEBUG         # SQL 사용에 따른 결과
    root: info                        # 기본은 INFO
    # com.zaxxer.hikari: DEBUG          # MYSQL 연결상태
    # org.springframework.jdbc: DEBUG   # JDBC

